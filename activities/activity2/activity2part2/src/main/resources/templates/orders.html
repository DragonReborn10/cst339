<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Orders</title>
</head>

<body>

    <h2 th:text="${title}">My Orders</h2>

    <table border="1">

        <thead>
            <tr>
                <th>Order Number</th>
                <th>Product Name</th>
                <th>Price</th>
                <th>Quantity</th>
            </tr>
        </thead>

        <tbody>

            <tr th:if="${orders.empty}">
                <td colspan="4">
                    No Orders Available
                </td>
            </tr>

            <tr th:each="order : ${orders}">
                <td th:text="${order.orderNo}"></td>
                <td th:text="${order.productName}"></td>
                <td th:text="${order.price}"></td>
                <td th:text="${order.quantity}"></td>
            </tr>

        </tbody>

    </table>

</body>
</html>
