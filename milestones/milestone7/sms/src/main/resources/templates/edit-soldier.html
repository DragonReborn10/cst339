<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Edit Soldier</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<!-- Shared application header -->
<div th:replace="~{layouts/defaulttemplate :: header('soldiers')}"></div>

<main class="container register-page py-5">

    <h1 class="text-center mb-5">Edit Soldier</h1>

    <!-- Update failure message -->
    <div class="alert alert-danger"
         th:if="${errorMessage}"
         th:text="${errorMessage}">
    </div>

    <!-- Update form -->
    <form
        th:action="@{/soldiers/edit/{id}(id=${soldierModel.soldierId})}"
        th:object="${soldierModel}"
        method="post">

        <!-- Submit the existing ID for Bean Validation.
        The controller still uses the ID from the URL. -->
        <input type="hidden" th:field="*{soldierId}">

        <!-- Soldier ID is displayed but cannot be edited -->
        <div class="row register-row">
            <div class="col-12 col-md-4">
                <label for="soldierId" class="form-label">
                    Soldier ID:
                </label>
            </div>

            <div class="col-12 col-md-6">
                <input
                    id="soldierId"
                    type="text"
                    class="form-input"
                    th:value="*{soldierId}"
                    readonly>
            </div>
        </div>

        <!-- First Name -->
        <div class="row register-row">
            <div class="col-12 col-md-4">
                <label for="firstName" class="form-label">
                    First Name:
                </label>
            </div>

            <div class="col-12 col-md-6">
                <input
                    id="firstName"
                    type="text"
                    class="form-input"
                    th:field="*{firstName}">

                <div class="validation-error"
                     th:if="${#fields.hasErrors('firstName')}"
                     th:errors="*{firstName}">
                </div>
            </div>
        </div>

        <!-- Last Name -->
        <div class="row register-row">
            <div class="col-12 col-md-4">
                <label for="lastName" class="form-label">
                    Last Name:
                </label>
            </div>

            <div class="col-12 col-md-6">
                <input
                    id="lastName"
                    type="text"
                    class="form-input"
                    th:field="*{lastName}">

                <div class="validation-error"
                     th:if="${#fields.hasErrors('lastName')}"
                     th:errors="*{lastName}">
                </div>
            </div>
        </div>

        <!-- Rank -->
        <div class="row register-row">
            <div class="col-12 col-md-4">
                <label for="rank" class="form-label">
                    Rank:
                </label>
            </div>

            <div class="col-12 col-md-6">
                <input
                    id="rank"
                    type="text"
                    class="form-input"
                    th:field="*{rank}">

                <div class="validation-error"
                     th:if="${#fields.hasErrors('rank')}"
                     th:errors="*{rank}">
                </div>
            </div>
        </div>

        <!-- Unit -->
        <div class="row register-row">
            <div class="col-12 col-md-4">
                <label for="unit" class="form-label">
                    Unit:
                </label>
            </div>

            <div class="col-12 col-md-6">
                <input
                    id="unit"
                    type="text"
                    class="form-input"
                    th:field="*{unit}">

                <div class="validation-error"
                     th:if="${#fields.hasErrors('unit')}"
                     th:errors="*{unit}">
                </div>
            </div>
        </div>

        <!-- MOS -->
        <div class="row register-row">
            <div class="col-12 col-md-4">
                <label for="mos" class="form-label">
                    MOS:
                </label>
            </div>

            <div class="col-12 col-md-6">
                <input
                    id="mos"
                    type="text"
                    class="form-input"
                    th:field="*{mos}">

                <div class="validation-error"
                     th:if="${#fields.hasErrors('mos')}"
                     th:errors="*{mos}">
                </div>
            </div>
        </div>

        <!-- Duty Status -->
        <div class="row register-row">
            <div class="col-12 col-md-4">
                <label for="dutyStatus" class="form-label">
                    Duty Status:
                </label>
            </div>

            <div class="col-12 col-md-6">
                <input
                    id="dutyStatus"
                    type="text"
                    class="form-input"
                    th:field="*{dutyStatus}">

                <div class="validation-error"
                     th:if="${#fields.hasErrors('dutyStatus')}"
                     th:errors="*{dutyStatus}">
                </div>
            </div>
        </div>

        <!-- Email -->
        <div class="row register-row">
            <div class="col-12 col-md-4">
                <label for="email" class="form-label">
                    Email:
                </label>
            </div>

            <div class="col-12 col-md-6">
                <input
                    id="email"
                    type="email"
                    class="form-input"
                    th:field="*{email}">

                <div class="validation-error"
                     th:if="${#fields.hasErrors('email')}"
                     th:errors="*{email}">
                </div>
            </div>
        </div>

        <!-- Phone Number -->
        <div class="row register-row">
            <div class="col-12 col-md-4">
                <label for="phoneNumber" class="form-label">
                    Phone Number:
                </label>
            </div>

            <div class="col-12 col-md-6">
                <input
                    id="phoneNumber"
                    type="tel"
                    class="form-input"
                    th:field="*{phoneNumber}">

                <div class="validation-error"
                     th:if="${#fields.hasErrors('phoneNumber')}"
                     th:errors="*{phoneNumber}">
                </div>
            </div>
        </div>

        <!-- Save and Cancel -->
        <div class="text-center mt-4">

            <button
                type="submit"
                class="btn btn-success me-2">
                Save Changes
            </button>

            <a th:href="@{/soldiers}"
               class="btn btn-secondary">
                Cancel
            </a>

        </div>

    </form>

</main>

<!-- Shared application footer -->
<div th:replace="~{layouts/defaulttemplate :: footer}"></div>

<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
</script>

</body>
</html>
