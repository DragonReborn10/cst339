<!doctype html>

<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>Login</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link rel="stylesheet" th:href="@{/css/style.css}" />
  </head>

  <body>
    <div th:replace="~{layouts/defaultTemplate :: header('login')}"></div>

    <main class="container login-page">
      <div
        th:if="${registrationSuccess}"
        class="alert alert-success text-center"
      >
        <span th:text="${registrationSuccess}"> </span>
      </div>

      <form th:action="@{/login}" th:object="${loginModel}" method="post">
        <!-- User Name -->

        <div class="row login-form-row">
          <div class="col-12 col-md-4">
            <label for="username" class="form-label"> User Name: </label>
          </div>

          <div class="col-12 col-md-6">
            <input
              type="text"
              id="username"
              class="form-input"
              th:field="*{username}"
            />

            <div
              class="validation-error"
              th:if="${#fields.hasErrors('username')}"
              th:errors="*{username}"
            ></div>
          </div>
        </div>

        <!-- Password -->

        <div class="row login-form-row">
          <div class="col-12 col-md-4">
            <label for="password" class="form-label"> Password: </label>
          </div>

          <div class="col-12 col-md-6">
            <input
              type="password"
              id="password"
              class="form-input"
              th:field="*{password}"
            />

            <div
              class="validation-error"
              th:if="${#fields.hasErrors('password')}"
              th:errors="*{password}"
            ></div>
          </div>
        </div>

        <!-- Login Button -->

        <div class="row">
          <div class="col-12 col-md-6 offset-md-4">
            <button type="submit" class="form-button">Login</button>
          </div>
        </div>
      </form>

      <!-- Recovery Links -->

      <div class="recovery-links">
        <a href="#"> Forgot User name? </a>

        <br />

        <a href="#"> Forgot Password? </a>
      </div>
    </main>

    <div th:replace="~{layouts/defaultTemplate :: footer}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
