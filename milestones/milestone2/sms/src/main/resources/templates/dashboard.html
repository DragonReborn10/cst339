<!doctype html>

<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>Dashboard</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link rel="stylesheet" th:href="@{/css/style.css}" />
  </head>

  <body>
    <div th:replace="~{layouts/defaultTemplate :: header('dashboard')}"></div>

    <main class="container dashboard-page">
      <div class="row g-4 justify-content-center">
        <!-- Formation Level Access -->

        <div class="col-12 col-md-6 col-lg-4">
          <a href="#" class="dashboard-link">
            <div class="dashboard-card">
              <h2>
                Formation
                <br />
                level Access
              </h2>
            </div>
          </a>
        </div>

        <!-- Soldier Data -->

        <div class="col-12 col-md-6 col-lg-4">
          <a href="#" class="dashboard-link">
            <div class="dashboard-card">
              <h2>
                View My
                <br />
                Soldier Data
              </h2>
            </div>
          </a>
        </div>

        <!-- Logout -->

        <div class="col-12 col-md-6 col-lg-4">
          <a th:href="@{/logout}" class="dashboard-link">
            <div class="dashboard-card">
              <h2>Logout</h2>
            </div>
          </a>
        </div>
      </div>
    </main>

    <div th:replace="~{layouts/defaultTemplate :: footer}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
