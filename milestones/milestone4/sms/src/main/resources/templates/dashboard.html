<!DOCTYPE html>

<html
    lang="en"
    xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1">

    <title>Dashboard</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        rel="stylesheet"
        th:href="@{/css/style.css}">

</head>

<body>


<!-- ===================================================== -->
<!-- SHARED HEADER                                         -->
<!-- ===================================================== -->

<div th:replace="~{layouts/defaulttemplate :: header('dashboard')}">
</div>


<!-- ===================================================== -->
<!-- DASHBOARD                                             -->
<!-- ===================================================== -->

<main class="container dashboard-page">

    <div class="row g-4 justify-content-center">


        <!-- ============================================= -->
        <!-- CREATE SOLDIER                                -->
        <!-- ============================================= -->

        <div class="col-12 col-md-6 col-lg-3">

            <a
                th:href="@{/soldiers/create}"
                class="dashboard-link">

                <div class="dashboard-card">

                    <h2>
                        Create
                        <br>
                        Soldier
                    </h2>

                </div>

            </a>

        </div>


        <!-- ============================================= -->
        <!-- FORMATION LEVEL ACCESS                        -->
        <!-- ============================================= -->

        <div class="col-12 col-md-6 col-lg-3">

            <a
                href="#"
                class="dashboard-link">

                <div class="dashboard-card">

                    <h2>
                        Formation
                        <br>
                        Level Access
                    </h2>

                </div>

            </a>

        </div>


        <!-- ============================================= -->
        <!-- VIEW SOLDIER DATA                             -->
        <!-- ============================================= -->

        <div class="col-12 col-md-6 col-lg-3">

            <a
                href="#"
                class="dashboard-link">

                <div class="dashboard-card">

                    <h2>
                        View My
                        <br>
                        Soldier Data
                    </h2>

                </div>

            </a>

        </div>


        <!-- ============================================= -->
        <!-- LOGOUT                                        -->
        <!-- ============================================= -->

        <div class="col-12 col-md-6 col-lg-3">

            <a
                th:href="@{/logout}"
                class="dashboard-link">

                <div class="dashboard-card">

                    <h2>
                        Logout
                    </h2>

                </div>

            </a>

        </div>


    </div>

</main>


<!-- ===================================================== -->
<!-- SHARED FOOTER                                         -->
<!-- ===================================================== -->

<div th:replace="~{layouts/defaulttemplate :: footer}">
</div>


<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
</script>


</body>

</html>
