<!DOCTYPE html>

<html
    lang="en"
    xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1">

    <title>Create Soldier</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        rel="stylesheet"
        th:href="@{/css/style.css}">

</head>

<body>


<!-- Shared Header -->

<div th:replace="~{layouts/defaulttemplate :: header('createSoldier')}">
</div>


<!-- Create Soldier Page -->

<main class="container register-page">

    <h1 class="text-center mb-5">
        Create Soldier
    </h1>


    <!-- Success Message -->

    <div
        class="alert alert-success"
        th:if="${successMessage}"
        th:text="${successMessage}">
    </div>


    <form
        th:action="@{/soldiers/create}"
        th:object="${soldierModel}"
        method="post">


        <!-- Soldier ID -->

        <div class="row register-row">

            <div class="col-12 col-md-4">

                <label
                    for="soldierId"
                    class="form-label">
                    Soldier ID:
                </label>

            </div>

            <div class="col-12 col-md-6">

                <input
                    id="soldierId"
                    type="text"
                    class="form-input"
                    th:field="*{soldierId}">

                <div
                    class="validation-error"
                    th:errors="*{soldierId}">
                </div>

            </div>

        </div>


        <!-- First Name -->

        <div class="row register-row">

            <div class="col-12 col-md-4">

                <label
                    for="firstName"
                    class="form-label">
                    First Name:
                </label>

            </div>

            <div class="col-12 col-md-6">

                <input
                    id="firstName"
                    type="text"
                    class="form-input"
                    th:field="*{firstName}">

                <div
                    class="validation-error"
                    th:errors="*{firstName}">
                </div>

            </div>

        </div>


        <!-- Last Name -->

        <div class="row register-row">

            <div class="col-12 col-md-4">

                <label
                    for="lastName"
                    class="form-label">
                    Last Name:
                </label>

            </div>

            <div class="col-12 col-md-6">

                <input
                    id="lastName"
                    type="text"
                    class="form-input"
                    th:field="*{lastName}">

                <div
                    class="validation-error"
                    th:errors="*{lastName}">
                </div>

            </div>

        </div>


        <!-- Rank -->

        <div class="row register-row">

            <div class="col-12 col-md-4">

                <label
                    for="rank"
                    class="form-label">
                    Rank:
                </label>

            </div>

            <div class="col-12 col-md-6">

                <input
                    id="rank"
                    type="text"
                    class="form-input"
                    th:field="*{rank}">

                <div
                    class="validation-error"
                    th:errors="*{rank}">
                </div>

            </div>

        </div>


        <!-- Unit -->

        <div class="row register-row">

            <div class="col-12 col-md-4">

                <label
                    for="unit"
                    class="form-label">
                    Unit:
                </label>

            </div>

            <div class="col-12 col-md-6">

                <input
                    id="unit"
                    type="text"
                    class="form-input"
                    th:field="*{unit}">

                <div
                    class="validation-error"
                    th:errors="*{unit}">
                </div>

            </div>

        </div>


        <!-- MOS -->

        <div class="row register-row">

            <div class="col-12 col-md-4">

                <label
                    for="mos"
                    class="form-label">
                    MOS:
                </label>

            </div>

            <div class="col-12 col-md-6">

                <input
                    id="mos"
                    type="text"
                    class="form-input"
                    th:field="*{mos}">

                <div
                    class="validation-error"
                    th:errors="*{mos}">
                </div>

            </div>

        </div>


        <!-- Duty Status -->

        <div class="row register-row">

            <div class="col-12 col-md-4">

                <label
                    for="dutyStatus"
                    class="form-label">
                    Duty Status:
                </label>

            </div>

            <div class="col-12 col-md-6">

                <select
                    id="dutyStatus"
                    class="form-input"
                    th:field="*{dutyStatus}">

                    <option value="">
                        Select Duty Status
                    </option>

                    <option value="Active">
                        Active
                    </option>

                    <option value="Inactive">
                        Inactive
                    </option>

                    <option value="Leave">
                        Leave
                    </option>

                </select>

                <div
                    class="validation-error"
                    th:errors="*{dutyStatus}">
                </div>

            </div>

        </div>


        <!-- Email -->

        <div class="row register-row">

            <div class="col-12 col-md-4">

                <label
                    for="email"
                    class="form-label">
                    Email:
                </label>

            </div>

            <div class="col-12 col-md-6">

                <input
                    id="email"
                    type="email"
                    class="form-input"
                    th:field="*{email}">

                <div
                    class="validation-error"
                    th:errors="*{email}">
                </div>

            </div>

        </div>


        <!-- Phone Number -->

        <div class="row register-row">

            <div class="col-12 col-md-4">

                <label
                    for="phoneNumber"
                    class="form-label">
                    Phone Number:
                </label>

            </div>

            <div class="col-12 col-md-6">

                <input
                    id="phoneNumber"
                    type="tel"
                    class="form-input"
                    th:field="*{phoneNumber}">

                <div
                    class="validation-error"
                    th:errors="*{phoneNumber}">
                </div>

            </div>

        </div>


        <!-- Submit Button -->

        <div class="row register-row">

            <div
                class="col-12 col-md-6 offset-md-4">

                <button
                    type="submit"
                    class="form-button">

                    Create Soldier

                </button>

            </div>

        </div>

    </form>

</main>


<!-- Shared Footer -->

<div th:replace="~{layouts/defaulttemplate :: footer}">
</div>


<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
</script>

</body>

</html>
