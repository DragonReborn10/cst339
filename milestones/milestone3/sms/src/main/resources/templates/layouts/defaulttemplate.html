<!doctype html>

<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>Soldier Management System</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link rel="stylesheet" th:href="@{/css/style.css}" />
  </head>

  <body>
    <header th:fragment="header(activePage)">
      <div class="sms-header">
        <!-- Application Title -->

        <div class="sms-title">SOLDIER MANAGEMENT SYSTEM</div>

        <!-- Navigation Bar -->

        <nav class="navbar navbar-expand-md navbar-dark p-0">
          <div class="container-fluid justify-content-center">
            <!-- Mobile Menu Button -->

            <button
              class="navbar-toggler mb-2"
              type="button"
              data-bs-toggle="collapse"
              data-bs-target="#smsNavigation"
              aria-controls="smsNavigation"
              aria-expanded="false"
              aria-label="Toggle navigation"
            >
              <span class="navbar-toggler-icon"></span>
            </button>

            <!-- Navigation Links -->

            <div
              class="collapse navbar-collapse justify-content-center"
              id="smsNavigation"
            >
              <ul class="navbar-nav sms-nav">
                <!-- Login -->

                <li class="nav-item">
                  <a
                    class="nav-link"
                    th:classappend="${activePage == 'login'} ? 'active-page' : ''"
                    th:href="@{/login}"
                  >
                    Login
                  </a>
                </li>

                <!-- Register -->

                <li class="nav-item">
                  <a
                    class="nav-link"
                    th:classappend="${activePage == 'register'} ? 'active-page' : ''"
                    th:href="@{/register}"
                  >
                    Register
                  </a>
                </li>

                <!-- Home -->

                <li class="nav-item">
                  <a
                    class="nav-link"
                    th:classappend="${activePage == 'home'} ? 'active-page' : ''"
                    th:href="@{/}"
                  >
                    Home
                  </a>
                </li>

                <!-- Dashboard -->

                <li class="nav-item">
                  <a
                    class="nav-link"
                    th:classappend="${activePage == 'dashboard'} ? 'active-page' : ''"
                    th:href="@{/dashboard}"
                  >
                    Dashboard
                  </a>
                </li>

                <!-- Logout -->

                <li class="nav-item">
                  <a class="nav-link" th:href="@{/logout}"> Logout </a>
                </li>
              </ul>
            </div>
          </div>
        </nav>
      </div>
    </header>

    <footer th:fragment="footer" class="sms-footer">
      <div class="container text-center">
        <p class="mb-1">SOLDIER MANAGEMENT SYSTEM</p>

        <p class="mb-0">CST-339</p>
      </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
