
<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport"
          content="width=device-width, initial-scale=1" />

    <title>Login - Soldier Management System</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet" />

    <link rel="stylesheet" th:href="@{/css/style.css}" />
</head>

<body>

    <!-- Shared application header -->
    <div th:replace="~{layouts/defaulttemplate :: header('login')}"></div>

    <main class="container login-page">

        <!-- Successful registration message -->
        <div
            th:if="${registrationSuccess}"
            class="alert alert-success text-center"
            role="alert"
            th:text="${registrationSuccess}">
        </div>

        <!-- Spring Security authentication failure -->
        <div
            th:if="${param.error}"
            class="alert alert-danger text-center"
            role="alert">
            Invalid username or password.
        </div>

        <!-- Successful logout message -->
        <div
            th:if="${param.logout}"
            class="alert alert-success text-center"
            role="alert">
            You have successfully logged out.
        </div>

        <!-- Spring Security handles POST /login -->
        <form th:action="@{/login}" method="post">

            <!-- CSRF protection -->
            <input
                type="hidden"
                th:name="${_csrf.parameterName}"
                th:value="${_csrf.token}" />

            <!-- Username -->
            <div class="row login-form-row">

                <div class="col-12 col-md-4">
                    <label for="username" class="form-label">
                        User Name:
                    </label>
                </div>

                <div class="col-12 col-md-6">
                    <input
                        type="text"
                        id="username"
                        name="username"
                        class="form-input"
                        autocomplete="username"
                        required />
                </div>

            </div>

            <!-- Password -->
            <div class="row login-form-row">

                <div class="col-12 col-md-4">
                    <label for="password" class="form-label">
                        Password:
                    </label>
                </div>

                <div class="col-12 col-md-6">
                    <input
                        type="password"
                        id="password"
                        name="password"
                        class="form-input"
                        autocomplete="current-password"
                        required />
                </div>

            </div>

            <!-- Submit login credentials -->
            <div class="row">

                <div class="col-12 col-md-6 offset-md-4">
                    <button
                        type="submit"
                        class="form-button">
                        Login
                    </button>
                </div>

            </div>

        </form>

        <!-- Registration navigation -->
        <div class="recovery-links">
            <a th:href="@{/register}">
                Don't have an account? Register
            </a>
        </div>

    </main>

    <!-- Shared footer -->
    <div th:replace="~{layouts/defaulttemplate :: footer}"></div>

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
    </script>

</body>
</html>
